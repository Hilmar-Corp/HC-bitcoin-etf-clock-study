name: Research Assurance

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research-assurance:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.13.0
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.0"
          cache: pip
          cache-dependency-path: requirements/dev.lock.txt

      - name: Install controlled dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements/dev.lock.txt
          python -m pip check

      - name: Validate canonical research scope
        run: |
          test -s config/canonical_scripts.txt
          while IFS= read -r f; do
            test -f "$f" || {
              echo "Missing canonical file: $f"
              exit 1
            }
          done < config/canonical_scripts.txt

      - name: Ruff canonical research scope
        run: |
          python -m ruff check $(cat config/canonical_scripts.txt) tests tests_public scripts

      - name: Compile canonical research scope
        run: |
          python -m py_compile $(cat config/canonical_scripts.txt)
          python -m compileall -q tests tests_public scripts

      - name: Public deterministic tests
        run: python -m pytest -q tests_public

      - name: Frozen repository evidence
        run: python -m scripts.research.verify_repository

      - name: Quant DD frozen assurance
        run: python -m scripts.research.verify_quant_dd

      - name: Upload assurance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-assurance-evidence
          if-no-files-found: error
          path: |
            PUBLICATION_MANIFEST.json
            evidence/repository_evidence.json
            evidence/research_assurance_snapshot.json
            artifacts/coverage/analytical_core_summary.json
            artifacts/multi_venue/coinbase_validation.json
            artifacts/source_validation/blackrock_ibit_current_volume_validation.json
            artifacts/final_assurance/consolidated_decision.json
            artifacts/final_assurance/assurance_checks.csv
